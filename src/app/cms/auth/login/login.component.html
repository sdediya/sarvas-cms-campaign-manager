<div class="cms-login">
  <div class="cms-login__panel">
    <div class="cms-login__brand">
      <img src="assets/images/company_logo.svg" alt="Sarva Sys" class="cms-login__logo" />
      <h1 class="cms-login__title">VAS CMS</h1>
      <p class="cms-login__subtitle">Sign in to continue</p>
    </div>

    <form class="cms-login__form" [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="cms-login__field">
        <label for="email1">Email</label>
        <input id="email1" type="text" formControlName="username" placeholder="Email address" pInputText class="w-full" />
      </div>

      <div class="cms-login__field">
        <label for="password">Password</label>
        <p-password id="password" formControlName="password" placeholder="Password" styleClass="w-full" inputStyleClass="w-full" [feedback]="false" [toggleMask]="true"></p-password>
      </div>

      <button pButton pRipple type="submit" class="cms-login__submit w-full" label="Sign In"></button>
    </form>
  </div>
</div>
<p-toast></p-toast>
