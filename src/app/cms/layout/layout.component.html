<div class="flex min-h-screen bg-background text-foreground">
  <aside
    class="fixed inset-y-0 left-0 z-40 w-64 border-r border-sidebar-border bg-sidebar text-sidebar-foreground transition-transform md:static md:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen"
  >
    <app-sidebar></app-sidebar>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <app-topbar (menuToggle)="toggleSidebar()"></app-topbar>
    <main class="flex-1 overflow-auto p-4 md:p-6">
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>
  </div>
  @if (sidebarOpen) {
    <div class="fixed inset-0 z-30 bg-black/40 md:hidden" (click)="toggleSidebar()"></div>
  }
</div>
