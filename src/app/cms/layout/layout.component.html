<div
  class="layout-shell flex min-h-screen flex-col bg-[var(--surface-ground,#eff3f8)] text-[var(--text-color,#495057)]"
>
  <app-topbar class="sticky top-0 z-50 w-full shrink-0" (menuToggle)="toggleSidebar()"></app-topbar>

  <div class="relative flex min-h-0 flex-1">
    <aside
      class="layout-shell-sidebar fixed z-40 flex w-[280px] flex-col overflow-hidden rounded-xl border border-border bg-sidebar text-sidebar-foreground shadow-[0px_3px_5px_rgba(0,0,0,0.02),0px_0px_2px_rgba(0,0,0,0.05),0px_1px_4px_rgba(0,0,0,0.08)] transition-transform duration-200"
      [class.-translate-x-[120%]]="!sidebarOpen"
      [class.translate-x-0]="sidebarOpen"
      aria-label="Main navigation"
    >
      <app-sidebar></app-sidebar>
    </aside>

    <div
      class="layout-shell-main flex min-w-0 flex-1 flex-col transition-[padding] duration-200"
      [class.layout-shell-main--sidebar]="sidebarOpen"
    >
      <main class="flex-1 overflow-auto px-4 py-4 md:px-6 md:py-5">
        <router-outlet></router-outlet>
      </main>
      <app-footer></app-footer>
    </div>
  </div>

  @if (sidebarOpen && isMobile) {
    <div class="fixed inset-0 z-30 bg-black/40 lg:hidden" (click)="toggleSidebar()"></div>
  }
</div>
