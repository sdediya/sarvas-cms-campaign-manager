<nav class="flex flex-col gap-1" aria-label="Main">
  @for (item of model; track item; let i = $index) {
    @if (!item.separator) {
      <div app-menuitem [item]="item" [index]="i" [root]="true"></div>
    }
    @if (item.separator) {
      <div class="my-2 border-t border-sidebar-border"></div>
    }
  }
</nav>
