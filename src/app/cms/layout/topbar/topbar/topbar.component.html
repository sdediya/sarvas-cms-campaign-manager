<header
  class="flex h-[4.25rem] w-full items-center gap-3 border-b border-border bg-white px-4 shadow-[0_1px_3px_rgba(0,0,0,0.04)]"
>
  <a routerLink="/" class="flex shrink-0 items-center">
    <img src="assets/images/shemaroo_logo.svg" alt="Shemaroo" class="h-8 w-auto" />
  </a>

  <button
    type="button"
    hlmBtn
    variant="ghost"
    size="icon"
    class="shrink-0 text-[var(--text-color,#495057)]"
    (click)="menuToggle.emit()"
    aria-label="Toggle menu"
  >
    <ng-icon name="lucideMenu" size="1.25rem" />
  </button>

  <div class="ms-auto">
    <button
      type="button"
      hlmBtn
      variant="ghost"
      size="sm"
      class="gap-2 text-[var(--text-color,#495057)]"
      [hlmDropdownMenuTrigger]="userMenu"
    >
      <ng-icon name="lucideUser" size="1.1rem" />
      <span class="hidden sm:inline">{{ displayName }}</span>
      <ng-icon name="lucideChevronDown" size="1rem" class="opacity-60" />
    </button>

    <ng-template #userMenu>
      <div hlmDropdownMenu class="min-w-48">
        <div hlmDropdownMenuLabel>Welcome, {{ displayName }}</div>
        <div hlmDropdownMenuSeparator></div>
        <button type="button" hlmDropdownMenuItem (triggered)="logout()">
          <ng-icon name="lucideLogOut" size="1rem" />
          Logout
        </button>
      </div>
    </ng-template>
  </div>
</header>
