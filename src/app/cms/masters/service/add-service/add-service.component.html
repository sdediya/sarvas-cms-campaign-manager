<div class="grid cms-page">
  <div class="col-12">
    <div class="card">
      <div class="cms-page-header">
        <div class="cms-page-header__text">
          <span class="cms-page-kicker">Masters</span>
          @if (!editable) {
            <h5 class="cms-page-title">Add Service</h5>
            <p class="cms-page-subtitle">Create a VAS service</p>
          }
          @if (editable) {
            <h5 class="cms-page-title">Edit Service</h5>
            <p class="cms-page-subtitle">Update service details</p>
          }
        </div>
      </div>
      <div class="cms-form-body">

      <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">
        <div class="p-fluid formgrid grid">
          <div class="field col-3 md:col-3">
            <div class="field col-12">
              <label htmlFor="service_name">Service Name<span label styleclass="label-required" class="text-red-500">*</span></label>
              <input pInputText id="service_name" type="text" formControlName="service_name" placeholder="Service Name" />
              @if (submitted && !f['service_name'].valid) {
                <div style="display: block; width: 100%;">
                  @if (f['service_name'].hasError('required') ) {
                    <span class="p-error">
                      Service Name is required
                    </span>
                  }
                </div>
              }
            </div>
          </div>
        </div>
        <div class="p-fluid formgrid grid pl-3">
          <div class="field col-12 md:col-3 pt-0">
            <button type="submit" pButton pRipple class="w-6 text-xl " size="small">Submit</button>
          </div>
        </div>
      </form>
      </div>
    </div>
  </div>
</div>
<p-toast></p-toast>
